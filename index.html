<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Blue Archive イントロクイズ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="https://bluearchive.jp/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
  /* ネオンカラーパレット */
  --blue-primary: #00f3ff;   /* ネオンシアン */
  --blue-secondary: #d500f9; /* ネオンマゼンタ */
  --blue-dark: #007799;
  --red-primary: #ff0055;    /* ネオンレッド */
  --red-dark: #990033;
  --green-primary: #00ff88;  /* ネオングリーン */
  --green-dark: #009955;
  
  /* ダークテーマの背景・テキスト */
  --grey-light: #1a1a24;
  --grey-mid: #6b7a99;
  --grey-dark: #0a0a0f;
  --text-light: #ffffff;
  --text-dark: #e0f0ff;
  --border-color: rgba(0, 243, 255, 0.3);
  
  /* ネオン発光エフェクト */
  --shadow: 0 0 10px rgba(0, 243, 255, 0.15);
  --shadow-hover: 0 0 20px rgba(0, 243, 255, 0.6), inset 0 0 10px rgba(0, 243, 255, 0.2);
  --text-glow-cyan: 0 0 5px #00f3ff, 0 0 10px #00f3ff;
  --text-glow-magenta: 0 0 5px #d500f9, 0 0 15px #d500f9;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  text-align: center;
  background-color: var(--grey-dark);
  color: var(--text-dark);
  margin: 0;
  padding: 1.5em;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  
  /* 背景画像の上に黒の半透明レイヤーを重ねて暗くする処理 */
  background-image: linear-gradient(rgba(10, 10, 15, 0.85), rgba(10, 10, 15, 0.95)), url('bg_sp.png');
  background-size: cover;
  background-position: center center;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

@media (min-aspect-ratio: 16/9) {
  body {
    background-image: linear-gradient(rgba(10, 10, 15, 0.85), rgba(10, 10, 15, 0.95)), url('bg_pc.png');
  }
}

main {
  width: 100%;
  max-width: 1200px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: clamp(2.5em, 5vw, 3em); 
  font-weight: 900;
  color: var(--text-light);
  margin-bottom: 0.5em; 
  /* ネオン風の影付け */
  text-shadow: var(--text-glow-cyan);
  line-height: 1.2;
  letter-spacing: 2px;
  text-transform: uppercase;
}

#game-view { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 800px; gap: 0.5em; }
#progress-container { width: 95%; max-width: 600px; margin: 0.5em 0; }
#progress-text { font-size: 1.8em; font-weight: 500; color: var(--blue-primary); display: block; margin-bottom: 0.5em; text-shadow: 0 0 5px rgba(0,243,255,0.5); }
.progress-bar-wrapper { width: 100%; background-color: rgba(255,255,255,0.1); border-radius: 8px; height: 12px; overflow: hidden; border: 1px solid var(--border-color); }
#progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--blue-secondary), var(--blue-primary)); transition: width 0.4s ease-in-out; box-shadow: 0 0 10px var(--blue-primary); }

#current-song-name {
  display: none; 
  font-size: clamp(1.8em, 6vw, 2.8em);
  font-weight: 900;
  color: var(--text-light);
  margin: 0.2em 0;
  text-shadow: var(--text-glow-magenta);
  word-break: break-all;
  line-height: 1.2;
  animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

p#score { 
  font-size: 2.2em; 
  font-weight: 700; 
  color: var(--blue-primary); 
  text-shadow: var(--text-glow-cyan);
}

p#result { 
  font-size: 2.5em; 
  font-weight: 900; 
  margin: 0.5em 0; 
  min-height: 1.5em; 
  animation: pop-in 0.3s ease-out; 
  color: #fff;
  text-shadow: var(--text-glow-magenta);
  display: none; 
  align-items: center;
  justify-content: center;
}

#answer-details { display: none; font-size: 1em; color: var(--text-dark); background-color: rgba(21, 0, 43, 0.6); border-left: 5px solid var(--blue-secondary); padding: 1em; border-radius: 8px; margin: 0.75em 0; width: 90%; max-width: 580px; text-align: left; line-height: 1.6; animation: fadeIn 0.5s ease-out; border: 1px solid rgba(213, 0, 249, 0.3); box-shadow: 0 0 10px rgba(213, 0, 249, 0.2); }

p#time-display { 
  font-size: 2.2em; 
  margin: 0; 
  color: var(--red-primary); 
  font-weight: 700; 
  text-shadow: 0 0 10px var(--red-primary);
}

/* ネオンボタンのスタイリング */
button, .yt-button { 
  font-family: 'Noto Sans JP', sans-serif; 
  font-size: 1.6em; 
  font-weight: 600; 
  cursor: pointer; 
  border-radius: 12px; 
  border: 1px solid var(--blue-primary); 
  padding: 0.8em 1.5em; 
  margin: 0.4em; 
  transition: all 0.2s ease-in-out; 
  box-shadow: var(--shadow); 
  display: inline-flex; 
  align-items: center; 
  justify-content: center; 
  gap: 0.5em; 
  white-space: normal; 
  line-height: 1.4; 
  background-color: rgba(10, 10, 20, 0.8); 
  color: var(--text-light); 
  text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
  text-decoration: none; 
  backdrop-filter: blur(4px);
}

button:hover, .yt-button:hover { 
  transform: translateY(-3px); 
  box-shadow: var(--shadow-hover); 
  background-color: rgba(0, 243, 255, 0.15); 
  text-shadow: var(--text-glow-cyan); 
}

button:active, .yt-button:active { transform: translateY(-1px) scale(0.98); }

#choices, #main-menu { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 800px; gap: 0.5em; }
#main-menu { margin-top: 3em; } 
#choices button, #main-menu button { width: 95%; max-width: 600px; }

/* 正解・不正解のネオン演出 */
button.correct { 
  background-color: rgba(0, 255, 136, 0.2) !important; 
  color: #fff !important; 
  border-color: var(--green-primary) !important; 
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.6), inset 0 0 10px rgba(0, 255, 136, 0.3) !important;
  text-shadow: 0 0 10px var(--green-primary) !important;
  transform: scale(1.05); 
}
button.incorrect { 
  background-color: rgba(255, 0, 85, 0.2) !important; 
  color: #fff !important; 
  border-color: var(--red-primary) !important; 
  box-shadow: 0 0 20px rgba(255, 0, 85, 0.6), inset 0 0 10px rgba(255, 0, 85, 0.3) !important;
  text-shadow: 0 0 10px var(--red-primary) !important;
  animation: shake 0.4s; 
}

#control-buttons { display: flex; flex-wrap: wrap; gap: 0.75em; justify-content: center; margin-top: 1em; }
#control-buttons button { border-color: var(--grey-mid); color: var(--text-light); text-shadow: none; box-shadow: none; }
#control-buttons button:hover { border-color: var(--blue-primary); box-shadow: var(--shadow-hover); }

/* ガラスパネル風スクリーン */
.screen { 
  display: none; 
  width: 100%; 
  max-width: 800px; 
  padding: 2em; 
  background: rgba(15, 15, 25, 0.85);
  border: 1px solid var(--border-color);
  border-radius: 16px; 
  box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); 
  backdrop-filter: blur(8px); 
  -webkit-backdrop-filter: blur(8px);
  animation: fadeIn 0.4s ease-in-out; 
}
.screen h2 { margin-top: 0; text-align: center; color: var(--blue-primary); text-shadow: var(--text-glow-cyan); }

.setting-item { margin: 1.5em 0; font-size: 1.1em; color: var(--text-light); }
.setting-item label { margin-right: 0.5em; font-weight: 500; }
.setting-item input, .setting-item select { padding: 0.5em; font-size: 1em; border-radius: 8px; border: 1px solid var(--blue-primary); background: rgba(0,0,0,0.5); color: var(--text-light); outline: none; }
.setting-item input:focus, .setting-item select:focus { box-shadow: var(--shadow); }

/* アーカイブ画面のダークトーン化 */
#sound-archive-screen { max-width: 1200px; }
#archive-controls { display: flex; flex-wrap: wrap; gap: 1em; justify-content: center; margin-bottom: 1.5em; width: 100%; }
#archive-search { flex-grow: 1; max-width: 600px; padding: 0.8em; font-size: 1.1em; border-radius: 8px; border: 1px solid var(--blue-primary); background: rgba(0,0,0,0.6); color: white; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
#archive-search::placeholder { color: var(--grey-mid); }
#archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5em; width: 100%; padding: 0.5em; box-sizing: border-box; max-height: 70vh; overflow-y: auto; }

.archive-card { background: rgba(20, 20, 30, 0.9); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: all 0.2s ease-in-out; cursor: pointer; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
.archive-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: var(--blue-primary); }
.archive-card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background-color: #000; border-bottom: 1px solid rgba(255,255,255,0.1); filter: brightness(0.9); }
.archive-card:hover .archive-card-thumb { filter: brightness(1.1); }
.archive-card-content { padding: 1em; flex-grow: 1; display: flex; flex-direction: column; }
.archive-card-title { font-weight: 700; font-size: 1.1em; margin-bottom: 0.3em; color: var(--text-light); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.archive-card-composer { font-size: 0.9em; color: var(--blue-primary); margin-bottom: 0.5em; }
.archive-card-meta { font-size: 0.8em; color: var(--blue-secondary); margin-top: auto; white-space: pre-wrap; }

#loading-overlay, #start-prompt { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 5, 0.9); color: var(--blue-primary); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 1000; animation: fadeIn 0.3s; text-shadow: var(--text-glow-cyan); font-size: 1.5em; font-weight:bold; }
#start-prompt button { padding: 1.5em 3em; font-size: clamp(1.2em, 5vw, 2em); background-color: rgba(0, 243, 255, 0.1); color: var(--blue-primary); border: 2px solid var(--blue-primary); font-weight: 700; box-shadow: var(--shadow); }
#start-prompt button:hover { background-color: rgba(0, 243, 255, 0.3); text-shadow: var(--text-glow-cyan); }

#stats-screen .stats-grid { display: grid; grid-template-columns: 1fr; gap: 2em; text-align: left; }

footer { margin-top: auto; padding-top: 1em; font-size: 0.9em; color: var(--grey-mid); display: none; }
.footer-box { border: 1px solid var(--border-color); padding: 1em; background-color: rgba(10,10,15,0.8); border-radius: 12px; box-shadow: 0 0 10px rgba(0,243,255,0.1); }
a.footer-link { text-decoration: none; color: var(--blue-secondary); font-weight: 500; text-shadow: 0 0 5px rgba(213,0,249,0.5); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { 0% { opacity: 0; transform: scale(0.5); } 70% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }

@media (min-width: 768px) { #stats-screen .stats-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) {
  #encyclopedia-layout { flex-direction: column; }
  #song-list-container { max-height: 45vh; }
}

/* 実績パネルのダーク化 */
.achievement { border-color: var(--border-color) !important; }
.achievement:not(.unlocked) { background: rgba(255,255,255,0.05) !important; color: var(--grey-mid) !important; }
.achievement.unlocked { background: rgba(0, 243, 255, 0.15) !important; color: var(--text-light) !important; border: 1px solid var(--blue-primary) !important; box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2); }
  </style>
</head>
<body>
  <div id="loading-overlay"><p>Now loading...</p></div>
  <main>
    <h1>Blue Archive<br>イントロクイズ</h1>

    <div id="main-menu"></div>
    
    <div id="game-view">
        <div id="progress-container">
            <span id="progress-text"></span>
            <div class="progress-bar-wrapper"><div id="progress-bar-fill"></div></div>
        </div>
        
        <p id="current-song-name"></p>

        <p id="score"></p>
        <p id="time-display"></p>
        <div id="player"></div>
        <div id="choices"></div>
        <p id="result"></p>
        <div id="answer-details"></div>
        <div id="game-controls-container">
          <div style="margin: 0.5em 0;">音量: <input type="range" id="volumeSlider" min="0" max="100" value="25" /></div>
          <div id="control-buttons">
            <button id="replayBtn">もう一度聞く</button>
            <button id="pauseBtn">再生</button>
            <button onclick="initGame()" style="background-color: var(--grey-dark);">ホームに戻る</button>
          </div>
        </div>
    </div>
    
    <div id="sound-archive-screen" class="screen">
        <h2>サウンドアーカイブ</h2>
        <div id="archive-controls">
            <input type="text" id="archive-search" placeholder="曲名、作曲者、関連キーワードで検索..." />
            <button id="archive-back-btn" style="padding: 0.5em 1em; font-size: 1.1em; background-color: var(--blue-primary); color: white;">戻る</button>
        </div>
        <div id="archive-grid"></div>
    </div>
    
    <div id="encyclopedia" class="screen"></div>
    <div id="settings-screen" class="screen"></div>
    <div id="stats-screen" class="screen"></div>
    <div id="start-prompt" style="display: none;"><button id="start-prompt-btn">タップして開始</button></div>
  </main>

  <footer>
    <div style="border: 1px solid var(--border-color); padding: 1em; background-color: #fff; border-radius: 12px; box-shadow: var(--shadow);">
      問い合わせは <a class="footer-link" href="https://x.com/TakoyakiAK47" target="_blank">たこやき</a> までDMお願いします。
    </div>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="playlist.js"></script>
  <script src="main.js"></script>
</body>
</html>
