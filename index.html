<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Blue Archive イントロクイズ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel=\"icon\" href=\"https://bluearchive.jp/favicon.ico\" type=\"image/x-icon\">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* マルチネオンカラーパレット */
      --neon-blue: #0df;
      --neon-purple: #b0f;
      --neon-green: #0f8;
      --neon-orange: #f80;
      --neon-yellow: #ff0;
      --neon-red: #f05;
      
      --bg-base: #050508;
      --panel-bg: rgba(10, 10, 15, 0.8);
      
      --text-light: #fff;
      --text-dark: #e0f0ff;
      
      --shadow-blue: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 221, 255, 0.2);
      --shadow-purple: 0 0 10px var(--neon-purple), inset 0 0 10px rgba(187, 0, 255, 0.2);
      --shadow-green: 0 0 10px var(--neon-green), inset 0 0 10px rgba(0, 255, 136, 0.2);
      --shadow-orange: 0 0 10px var(--neon-orange), inset 0 0 10px rgba(255, 136, 0, 0.2);
      --shadow-yellow: 0 0 10px var(--neon-yellow), inset 0 0 10px rgba(255, 255, 0, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      text-align: center;
      background-color: var(--bg-base);
      color: var(--text-dark);
      margin: 0;
      padding: 1.5em;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      
      /* ユーザー指定の新しい背景画像を設定（オーバーレイで視認性を確保） */
      background-image: linear-gradient(rgba(5, 5, 8, 0.75), rgba(5, 5, 8, 0.85)), url('{2EF3F8C4-29E3-467F-9362-971AB1A68D96}.png');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    main {
      width: 100%;
      max-width: 1000px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    h1 {
      font-size: clamp(2em, 5vw, 3.5em);
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.2em;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-purple), 0 0 30px var(--neon-blue);
      line-height: 1.2;
      font-style: italic;
    }
    
    #game-view, .screen {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2em;
      width: 100%;
      max-width: 800px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 2px var(--neon-blue);
      position: relative;
    }
    
    #game-view::before, .screen::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-orange), var(--neon-green));
      z-index: -1;
      border-radius: 18px;
      opacity: 0.25;
      filter: blur(4px);
    }

    #progress-container { width: 100%; margin: 1em 0; display: flex; flex-direction: column; align-items: center; }
    #progress-text { 
      font-size: 1.6em; font-weight: 700; color: var(--neon-yellow); 
      text-shadow: 0 0 8px var(--neon-yellow);
      letter-spacing: 2px;
      margin-bottom: 0.5em; display: block;
    }
    
    .progress-bar-wrapper { 
      width: 95%; max-width: 600px; background: #000; border-radius: 6px; height: 14px;
      border: 1px solid #333; box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
      position: relative; overflow: hidden;
    }
    
    #progress-bar-fill {
      height: 100%; width: 0%;
      background: repeating-linear-gradient(90deg, var(--neon-orange), var(--neon-orange) 10px, transparent 10px, transparent 12px);
      box-shadow: 0 0 10px var(--neon-orange);
      transition: width 0.3s ease;
    }

    p#score, p#time-display {
      font-size: 2em; font-weight: 900;
      font-family: monospace;
      margin: 0.2em 0;
      background: rgba(0,0,0,0.6);
      padding: 0.2em 0.6em;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    p#score { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
    p#time-display { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

    #current-song-name {
      display: none; 
      font-size: clamp(1.5em, 5vw, 2.5em);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
      margin: 0.5em 0;
      line-height: 1.3;
      padding: 0.6em;
      background: rgba(0, 0, 0, 0.7);
      border-left: 6px solid var(--neon-purple);
      border-right: 6px solid var(--neon-purple);
      border-radius: 4px;
    }

    /* ボタンの配置・位置・サイズを元の「縦並び1列」に修正 */
    #choices, #main-menu { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      width: 100%; 
      max-width: 800px; 
      gap: 0.6em; 
      margin-top: 1em;
    }
    
    #main-menu { margin-top: 2em; }
    
    button, .yt-button {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.5em; 
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px; 
      padding: 0.8em 1.5em; 
      margin: 0.2em;
      width: 95%; 
      max-width: 600px; /* 横幅の制限を復活 */
      color: #fff;
      background: rgba(15, 15, 20, 0.85);
      border: 2px solid var(--neon-blue);
      box-shadow: var(--shadow-blue);
      text-shadow: 0 0 5px var(--neon-blue);
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.4;
    }
    
    button:hover, .yt-button:hover {
      background: rgba(0, 221, 255, 0.15);
      transform: translateY(-3px);
      box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
    }
    button:active, .yt-button:active { transform: scale(0.98); }

    /* メニューボタンごとのネオンカラー分岐 */
    #main-menu button:nth-child(1) { border-color: var(--neon-blue); box-shadow: var(--shadow-blue); text-shadow: 0 0 5px var(--neon-blue); }
    #main-menu button:nth-child(1):hover { background: rgba(0,221,255,0.2); box-shadow: 0 0 25px var(--neon-blue), inset 0 0 10px var(--neon-blue); }
    
    #main-menu button:nth-child(2) { border-color: var(--neon-purple); box-shadow: var(--shadow-purple); text-shadow: 0 0 5px var(--neon-purple); }
    #main-menu button:nth-child(2):hover { background: rgba(187,0,255,0.2); box-shadow: 0 0 25px var(--neon-purple), inset 0 0 10px var(--neon-purple); }
    
    #main-menu button:nth-child(3) { border-color: var(--neon-orange); box-shadow: var(--shadow-orange); text-shadow: 0 0 5px var(--neon-orange); }
    #main-menu button:nth-child(3):hover { background: rgba(255,136,0,0.2); box-shadow: 0 0 25px var(--neon-orange), inset 0 0 10px var(--neon-orange); }
    
    #main-menu button:nth-child(4) { border-color: var(--neon-green); box-shadow: var(--shadow-green); text-shadow: 0 0 5px var(--neon-green); }
    #main-menu button:nth-child(4):hover { background: rgba(0,255,136,0.2); box-shadow: 0 0 25px var(--neon-green), inset 0 0 10px var(--neon-green); }

    #main-menu button:nth-child(5) { border-color: var(--neon-yellow); box-shadow: var(--shadow-yellow); text-shadow: 0 0 5px var(--neon-yellow); }
    #main-menu button:nth-child(5):hover { background: rgba(255,255,0,0.2); box-shadow: 0 0 25px var(--neon-yellow), inset 0 0 10px var(--neon-yellow); }

    #main-menu button:nth-child(6) { border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red), inset 0 0 10px rgba(255,0,85,0.1); text-shadow: 0 0 5px var(--neon-red); }
    #main-menu button:nth-child(6):hover { background: rgba(255,0,85,0.2); box-shadow: 0 0 25px var(--neon-red), inset 0 0 10px var(--neon-red); }

    button.correct {
      background: rgba(0, 255, 136, 0.3) !important;
      border-color: var(--neon-green) !important;
      box-shadow: 0 0 25px var(--neon-green), inset 0 0 15px var(--neon-green) !important;
      text-shadow: 0 0 10px #fff !important;
      transform: scale(1.03) !important;
    }
    
    button.incorrect {
      background: rgba(255, 0, 85, 0.3) !important;
      border-color: var(--neon-red) !important;
      box-shadow: 0 0 25px var(--neon-red), inset 0 0 15px var(--neon-red) !important;
      animation: shake 0.4s;
    }

    /* (その他のスタイルは変化なしのため中略) */
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  
  <script>
    // 幾何学模様のパーティクル(くるくる回る回転ネオン三角形)
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const colors = ['#00f3ff', '#d500f9', '#00ff88', '#ffaa00', '#fff700'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.radius = Math.random() * 3 + 2; // 三角形のサイズ基準
        this.angle = Math.random() * Math.PI * 2; // 初期回転角度
        this.va = (Math.random() - 0.5) * 0.03; // 自転の回転速度
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.va;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.beginPath();
        
        // 中心から綺麗な正三角形を描画
        const r = this.radius * 3;
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.866, r * 0.5);
        ctx.lineTo(-r * 0.866, r * 0.5);
        ctx.closePath();
        
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
        ctx.shadowBlur = 0;
      }
    }

    function initParticles() {
      particles = [];
      const numParticles = Math.min(Math.floor((width * height) / 12000), 80);
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();

    function animate() {
      ctx.clearRect(0, 0, width, height);
      
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        
        // 三角形同士を光のネットワーク線でつなぐ
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < 130) {
            ctx.beginPath();
            ctx.strokeStyle = particles[i].color;
            ctx.globalAlpha = 1 - dist / 130;
            ctx.lineWidth = 1;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    // イコライザー制御用のMutationObserverなど（中略）
  </script>
</body>
</html>
